# ptouch-print-server config. Copy to /etc/ptouch-print-server/config.toml.

# How long a request waits for another print job to finish before getting busy.
busy_timeout = "30s"

# How long to wait for the printer to answer a status request.
status_timeout = "3s"

# How long to wait for the printer to confirm a label printed.
print_timeout = "20s"

# Longest label accepted, in dots (180 per inch). 3600 is about 50 cm.
max_label_dots = 3600

[bluetooth]
# Advertised device name, 1 to 29 bytes.
name = "PT-P700"

# BlueZ adapter.
adapter = "hci0"

# Disconnect a client that sends nothing for this long. Must be longer than
# busy_timeout + status_timeout + print_timeout.
idle_timeout = "2m"
